<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajit | ajit.business</title>
  <meta name="description" content="Meet Ajit's photo-real 3D avatar and hear about ajit.business.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23f0b35a'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="https://ajit.business" data-site-link>ajit<span>.business</span></a>
  </header>

  <main class="hero">
    <section class="stage" id="stage" aria-label="Ajit's 3D avatar">
      <div class="view" id="view"></div>
      <canvas class="fallback-photo" id="fallbackPhoto" role="img" aria-label="Portrait of Ajit" hidden></canvas>
      <div class="loader" id="loader" role="status">
        <span class="ring" aria-hidden="true"></span>
        <span id="loaderText">Building 3D avatar…</span>
      </div>
      <button class="play" id="play" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        <span>Hear from Ajit</span>
      </button>
      <p class="captions" id="captions" aria-live="polite"></p>
      <p class="notice" id="notice" hidden></p>
    </section>

    <aside class="panel">
      <p class="eyebrow">ajit.business</p>
      <h1 id="headline">Hi, I'm Ajit.</h1>
      <p class="lede" id="lede"></p>
      <p class="label" id="topicsLabel">Ask me about</p>
      <div class="topics" id="topics" role="group" aria-labelledby="topicsLabel"></div>
      <div class="controls">
        <button class="ghost" id="stop" type="button" disabled>Stop</button>
        <label class="voice">Voice <select id="voice"></select></label>
      </div>
      <a class="visit" href="https://ajit.business" data-site-link>Visit ajit.business <span aria-hidden="true">→</span></a>
    </aside>
  </main>

</html>
